<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Lattice logo: a shield holding a lattice (the maths behind ML-KEM and ML-DSA). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26334a"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8ff0"/>
      <stop offset="1" stop-color="#2459a8"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <path d="M128 36 L204 64 V124 C204 170 172 204 128 222 C84 204 52 170 52 124 V64 Z"
        fill="url(#shield)"/>
  <g transform="translate(-2 6)">
  <!-- a skewed 3x3 lattice -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M86 92 L122 84 L158 76"/>
    <path d="M94 128 L130 120 L166 112"/>
    <path d="M102 164 L138 156 L174 148"/>
    <path d="M86 92 L94 128 L102 164"/>
    <path d="M122 84 L130 120 L138 156"/>
    <path d="M158 76 L166 112 L174 148"/>
  </g>
  <g fill="#ffffff">
    <circle cx="86" cy="92" r="10"/>
    <circle cx="122" cy="84" r="10"/>
    <circle cx="158" cy="76" r="10"/>
    <circle cx="94" cy="128" r="10"/>
    <circle cx="166" cy="112" r="10"/>
    <circle cx="102" cy="164" r="10"/>
    <circle cx="138" cy="156" r="10"/>
    <circle cx="174" cy="148" r="10"/>
  </g>
  <!-- the centre point, highlighted: the secret short vector -->
  <circle cx="130" cy="120" r="15" fill="#5cc4a0" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
